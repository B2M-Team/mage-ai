        window.requestIdleCallback = function (callback, options) {

            const start = Date.now();

            return setTimeout(() => {
                callback({
                    didTimeout: false,
                    timeRemaining: function () {
                        return Math.max(0, timeout - (Date.now() - start));

            }, 1);
        };

        window.cancelIdleCallback = function (id) {
            clearTimeout(id);
        };
    }
